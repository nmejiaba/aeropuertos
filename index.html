<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Briefing">
<meta name="theme-color" content="#0b2a4a">
<title>Briefing de vuelo</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#14202e; --muted:#5b6b7c; --line:#d8dde3;
  --accent:#0b57d0; --accent-ink:#ffffff; --danger:#b3261e; --field:#fbfcfd; --active:#e6eefc; --warn:#9a5b00;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1319; --panel:#161d26; --ink:#e8edf2; --muted:#93a1b0; --line:#2a3441;
    --accent:#7aa7ff; --accent-ink:#0b1220; --danger:#ff8a80; --field:#111821; --active:#1d2b44; --warn:#f0b35a;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink); -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{
  min-height:44px; padding:0 14px; border-radius:10px; border:1px solid var(--line);
  background:var(--panel); cursor:pointer;
}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.danger{color:var(--danger);border-color:var(--danger);background:transparent}
button.ghost{border-color:transparent;background:transparent;color:var(--accent)}
button:active{opacity:.75}

.app{display:grid;grid-template-columns:340px 1fr;height:100vh;height:100dvh}
.side{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0}
.side-head{padding:calc(12px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px;background:var(--bg);padding:4px;border-radius:12px;margin-bottom:10px}
.tabs button{flex:1;border:0;background:transparent;min-height:40px;padding:0 6px;border-radius:9px;font-weight:600;font-size:15px;color:var(--muted)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.side-head input[type=search]{
  width:100%;min-height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:var(--field);margin-bottom:10px
}
.row{display:flex;gap:8px}
.row button{flex:1;padding:0 8px}
.list{list-style:none;margin:0;padding:0;overflow:auto;flex:1;-webkit-overflow-scrolling:touch}
.list li button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;min-height:56px;
  border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:8px 14px
}
.list li.active button{background:var(--active)}
.list .icao{font-weight:700;font-size:18px;min-width:56px}
.list .meta{color:var(--muted);font-size:14px;flex:1}
.badge{font-size:13px;font-weight:700;border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.none{padding:18px 14px;color:var(--muted)}
.side-foot{padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);color:var(--muted);font-size:13px}

.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.main-head{
  display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2
}
.main-head h2{margin:0;font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.back{display:none}
.formEl{overflow:auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;flex:1}
fieldset{border:1px solid var(--line);border-radius:12px;background:var(--panel);margin:0 0 16px;padding:10px 14px 14px;min-width:0}
legend{font-weight:700;padding:0 6px;color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px 14px;margin-bottom:12px}
.grid:last-child{margin-bottom:0}
.sub{font-weight:600;font-size:15px;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.sub:first-of-type{margin-top:4px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.wide{grid-column:1 / -1}
.fld span{font-size:13px;color:var(--muted);letter-spacing:.02em}
.fld span.hint{color:var(--warn);font-size:12px}
.fld input,.fld select,.fld textarea{
  width:100%;min-height:44px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--field)
}
.fld textarea{resize:vertical;line-height:1.35;overflow:hidden}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:0}

.info{border:1px dashed var(--line);border-radius:12px;background:var(--field);padding:10px 12px;margin:0 0 12px}
.info-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.info-head b{flex:1;font-size:14px}
.info-head button{min-height:36px;font-size:14px}
.irow{padding:6px 0;border-top:1px solid var(--line)}
.irow:first-of-type{border-top:0}
.ik{display:block;font-size:12px;color:var(--muted)}
.iv{white-space:pre-wrap;overflow-wrap:anywhere}
.info .none{padding:4px 0}

.empty{display:none;margin:auto;color:var(--muted);padding:30px;text-align:center}
.main.is-empty .formEl{display:none}
.main.is-empty .empty{display:block}
.main.is-empty #btnSave,.main.is-empty #btnDelete{display:none}

#toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:#14202e;color:#fff;padding:10px 16px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;
  transition:opacity .2s;z-index:10;max-width:90vw;text-align:center
}
#toast.show{opacity:1}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);padding:18px;max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog h3{margin:0 0 6px}
dialog p{margin:0 0 14px;color:var(--muted);font-size:14px}
dialog .stack{display:flex;flex-direction:column;gap:10px}

@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .main{display:none}
  .app.show-form .side{display:none}
  .app.show-form .main{display:flex}
  .back{display:inline-block}
}
</style>
</head>
<body>
<noscript>Esta página necesita JavaScript.</noscript>

<div class="app" id="app">
  <aside class="side">
    <div class="side-head">
      <div class="tabs">
        <button id="tabFlights" type="button">Vuelos</button>
        <button id="tabAirports" type="button">Aeropuertos</button>
        <button id="tabPlanes" type="button">Aviones</button>
      </div>
      <input id="q" type="search" autocomplete="off" autocapitalize="characters" spellcheck="false">
      <div class="row">
        <button id="btnNew" type="button" class="primary">+ Nuevo</button>
        <button id="btnImport" type="button">Importar</button>
        <button id="btnExport" type="button">Exportar</button>
      </div>
    </div>
    <ul id="list" class="list"></ul>
    <div class="side-foot" id="info"></div>
  </aside>

  <main class="main is-empty" id="main">
    <div class="main-head">
      <button id="btnBack" type="button" class="ghost back">‹ Lista</button>
      <h2 id="formTitle">Vuelo</h2>
      <span class="spacer"></span>
      <button id="btnDelete" type="button" class="danger">Eliminar</button>
      <button id="btnSave" type="button" class="primary">Guardar</button>
    </div>
    <form id="formFlights" class="formEl" autocomplete="off" onsubmit="return false" hidden></form>
    <form id="formAirports" class="formEl" autocomplete="off" onsubmit="return false" hidden></form>
    <form id="formPlanes" class="formEl" autocomplete="off" onsubmit="return false" hidden></form>
    <div class="empty" id="empty"></div>
  </main>
</div>

<datalist id="dlAirports"></datalist>
<datalist id="dlPlanes"></datalist>
<input type="file" id="file" accept=".csv,.json,text/csv,application/json,text/plain" hidden>

<dialog id="dlgExport">
  <h3>Exportar</h3>
  <p>El respaldo (.json) guarda vuelos y aeropuertos juntos y sirve para pasarlos a otro dispositivo. La tabla (.csv) se abre en Excel o Google Sheets.</p>
  <div class="stack">
    <button id="expJson" type="button" class="primary">Respaldo completo (.json)</button>
    <button id="expCsv" type="button"></button>
    <button id="expClose" type="button" class="ghost">Cerrar</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
"use strict";

/* ====================================================================
   CONFIGURACIÓN
   Los nombres de la izquierda son los de las columnas de tus hojas
   (no los cambies: sirven para importar). Lo de la derecha es el rótulo
   que se ve sobre cada campo: cámbialo a tu gusto.
   ==================================================================== */

// ---- Aeropuertos (columnas de AD_DB) ----
const LABELS_A = {
  DATE: "DATE", ICAO: "ICAO", IATA: "IATA", CAT: "CAT",
  DATE_CCI: "DATE_CCI", DATE_AOI: "DATE_AOI", CCI_ARR: "CCI_ARR", FREQ: "FREQ",
  CCI_PARK: "CCI_PARK", CCI_RETI: "CCI_RETI", CCI_GNDOPS: "CCI_GNDOPS",
  AOI_Taxirest: "AOI_Taxirest", AOI_Ops: "AOI_Ops", AOI_NAP: "AOI_NAP",
  AOI_Speed_ARR: "AOI_Speed_ARR", AOI_NAP_ARR: "AOI_NAP_ARR", AOI_PROC_ARR: "AOI_PROC_ARR",
  CRA_ARR: "CRA_ARR", CCI_DEP: "CCI_DEP", AOI_Speed_DEP: "AOI_Speed_DEP",
  AOI_STARTUP: "AOI_STARTUP", AOI_PROC_DEP: "AOI_PROC_DEP", AOI_NAP_DEP: "AOI_NAP_DEP",
  CRA_DEP: "CRA_DEP", VARIOS_DEP: "VARIOS_DEP", VARIOS_ARR: "VARIOS_ARR"
};

// ---- Vuelos (columnas de FLIGHT_DB) ----
const LABELS_F = {
  DATE: "DATE", DEP: "DEP", DEP_UTC: "DEP UTC", ARR: "ARR", ARR_UTC: "ARR UTC",
  EFB: "EFB", CHART: "CHART", STD: "STD", STA: "STA", STA_ALT: "STA (ALT)",
  FLT_NUM: "FLT NUM", REG: "REG", OFP: "OFP", LAYOVER: "LAYOVER", NOT_COMMS: "NOTICES & COMS",
  FO: "FO", PUR: "PUR", SUP: "CSV", CAPT_AUG: "CAPT (aug)", FO_AUG: "FO (aug)", MEL: "MEL",
  DEP_NOTAMS: "NOTAMS", ARR_NOTAMS: "NOTAMS", ARR_WX: "WX", ARR_WX_TIME: "WX hora",
  CRZ_SIGWX: "SIG_WX", CRZ_TURB: "TURB", CRZ_TROPO: "TROPO",
  NOTES_DEP: "DEP NOTES", NOTES_ARR: "ARR NOTES", NOTES_CRZ: "CRZ NOTES",
  TRIP: "TRIP", BLK: "BLK", FL: "FL",
  ALT: "ALTERNATE (ICAO)", ALTNOTAMS: "NOTAMS", ALTWX: "WX"
};

// Matrículas iniciales (las de tu hoja AVIONES). Se cargan una sola vez; luego editas la lista en la pestaña Aviones.
const PLANES = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").map(c => "A6-EX" + c);

// ---- Aviones (hoja AVIONES: una columna con la matrícula) ----
const LABELS_P = { REG: "Matrícula (REG)" };
const P_ORDER = ["REG"];

/* ---- Orden de columnas: igual que tus hojas ---- */
const A_ORDER = Object.keys(LABELS_A);
const F_ORDER = [
  "DATE","DEP","DEP_UTC","ARR","ARR_UTC","EFB","CHART","STD","STA","STA_ALT","FLT_NUM","REG","OFP",
  "LAYOVER","NOT_COMMS","FO","PUR","SUP","CAPT_AUG","FO_AUG","MEL","DEP_NOTAMS","ARR_NOTAMS","ARR_WX",
  "ARR_WX_TIME","DEP_CAT","DEP_FRQ","DEP_CCI_DATE","CCI_DEP","AOI_Speed_DEP","AOI_STARTUP","AOI_PROC_DEP",
  "AOI_NAP_DEP","CRA_DEP","VARIOS_DEP","ARR_CAT","CCI_DATE_ARR","CCI_ARR","ARR_FRQ","CCI_PARK","CCI_RETI",
  "CCI_GNDOPS","AOI_Taxirest","AOI_Ops","AOI_NAP","AOI_Speed_ARR","AOI_NAP_ARR","AOI_PROC_ARR","CRA_ARR",
  "VARIOS_ARR","CRZ_SIGWX","CRZ_TURB","CRZ_TROPO","NOTES_DEP","NOTES_ARR","NOTES_CRZ","TRIP","BLK","FL",
  "ALT","ALTNOTAMS","ALTWX"
];
// En tu hoja FLIGHT_DB esta columna se llama "AOI_NAP _ARR" (con espacio)
const F_HEADER = { AOI_NAP_ARR: "AOI_NAP _ARR" };

/* ---- Datos del aeropuerto que se copian al vuelo (igual que GE_FLIGHT): [campo del vuelo, campo del aeropuerto] ---- */
const SNAP_DEP = [
  ["DEP_CAT","CAT"], ["DEP_FRQ","FREQ"], ["DEP_CCI_DATE","DATE_CCI"], ["CCI_DEP","CCI_DEP"],
  ["AOI_Speed_DEP","AOI_Speed_DEP"], ["AOI_STARTUP","AOI_STARTUP"], ["AOI_PROC_DEP","AOI_PROC_DEP"],
  ["AOI_NAP_DEP","AOI_NAP_DEP"], ["CRA_DEP","CRA_DEP"], ["VARIOS_DEP","VARIOS_DEP"]
];
const SNAP_ARR = [
  ["ARR_CAT","CAT"], ["CCI_DATE_ARR","DATE_CCI"], ["CCI_ARR","CCI_ARR"], ["ARR_FRQ","FREQ"],
  ["CCI_PARK","CCI_PARK"], ["CCI_RETI","CCI_RETI"], ["CCI_GNDOPS","CCI_GNDOPS"],
  ["AOI_Taxirest","AOI_Taxirest"], ["AOI_Ops","AOI_Ops"], ["AOI_NAP","AOI_NAP"],
  ["AOI_Speed_ARR","AOI_Speed_ARR"], ["AOI_NAP_ARR","AOI_NAP_ARR"], ["AOI_PROC_ARR","AOI_PROC_ARR"],
  ["CRA_ARR","CRA_ARR"], ["VARIOS_ARR","VARIOS_ARR"]
];
const SNAP_KEYS = SNAP_DEP.concat(SNAP_ARR).map(p => p[0]);

/* ---- Pantallas: cómo se agrupan los campos. t: text | date | select | area | icao | reg ---- */
const SECTIONS_A = [
  { title: "Identificación", items: [
    { k: "DATE", t: "date" }
  ]},
  { title: "CCI", items: [
    { sub: "Information" },
    { k: "ICAO", t: "text", upper: true },
    { k: "IATA", t: "text", upper: true },
    { k: "CAT", t: "select", opts: ["CAT A", "CAT B", "CAT C"] },
    { k: "DATE_CCI", t: "date" },
    { sub: "Arrival" },
    { k: "CCI_ARR", t: "area" },
    { sub: "Ground Operations" },
    { k: "FREQ", t: "text" },
    { k: "CCI_PARK", t: "area" }, { k: "CCI_RETI", t: "area" }, { k: "CCI_GNDOPS", t: "area" },
    { sub: "Departure" },
    { k: "CCI_DEP", t: "area" }
  ]},
  { title: "AOI", items: [
    { sub: "General" },
    { k: "DATE_AOI", t: "date" },
    { k: "AOI_Taxirest", t: "area" }, { k: "AOI_Ops", t: "area" }, { k: "AOI_NAP", t: "area" },
    { sub: "Arrival" },
    { k: "AOI_Speed_ARR", t: "area" }, { k: "AOI_NAP_ARR", t: "area" }, { k: "AOI_PROC_ARR", t: "area" },
    { sub: "Departures" },
    { k: "AOI_Speed_DEP", t: "area" }, { k: "AOI_STARTUP", t: "area" },
    { k: "AOI_PROC_DEP", t: "area" }, { k: "AOI_NAP_DEP", t: "area" }
  ]},
  { title: "Country Rules and Regulations", items: [
    { sub: "Departure" },
    { k: "CRA_DEP", t: "area" },
    { sub: "Arrivals" },
    { k: "CRA_ARR", t: "area" }
  ]},
  { title: "Varios", items: [
    { sub: "Departure" },
    { k: "VARIOS_DEP", t: "area" },
    { sub: "Arrivals" },
    { k: "VARIOS_ARR", t: "area" }
  ]}
];

const SECTIONS_P = [
  { title: "Avión", items: [ { k: "REG", t: "text", upper: true } ] }
];

const SECTIONS_F = [
  { title: "Vuelo", items: [
    { k: "DATE", t: "date" },
    { k: "FLT_NUM", t: "text", upper: true },
    { k: "REG", t: "reg", upper: true },
    { k: "OFP", t: "text" }
  ]},
  { title: "Ruta y horarios", items: [
    { k: "DEP", t: "icao", side: "DEP" },
    { k: "DEP_UTC", t: "text" },
    { k: "ARR", t: "icao", side: "ARR" },
    { k: "ARR_UTC", t: "text" },
    { k: "STD", t: "text" },
    { k: "STA", t: "text" },
    { k: "STA_ALT", t: "text" },
    { k: "TRIP", t: "text" },
    { k: "BLK", t: "text" },
    { k: "FL", t: "text" }
  ]},
  { title: "Tripulación", items: [
    { k: "FO", t: "text" }, { k: "PUR", t: "text" }, { k: "SUP", t: "text" },
    { k: "CAPT_AUG", t: "text" }, { k: "FO_AUG", t: "text" }
  ]},
  { title: "Operación", items: [
    { k: "EFB", t: "text" }, { k: "CHART", t: "text" }, { k: "LAYOVER", t: "text" },
    { k: "NOT_COMMS", t: "area" }, { k: "MEL", t: "area" }
  ]},
  { title: "Salida (DEP)", items: [
    { k: "DEP_NOTAMS", t: "area" },
    { info: "DEP" },
    { k: "NOTES_DEP", t: "area" }
  ]},
  { title: "Llegada (ARR)", items: [
    { k: "ARR_NOTAMS", t: "area" },
    { k: "ARR_WX_TIME", t: "text" },
    { k: "ARR_WX", t: "area" },
    { info: "ARR" },
    { k: "NOTES_ARR", t: "area" }
  ]},
  { title: "Crucero (CRZ)", items: [
    { k: "CRZ_SIGWX", t: "area" }, { k: "CRZ_TURB", t: "area" }, { k: "CRZ_TROPO", t: "area" },
    { k: "NOTES_CRZ", t: "area" }
  ]},
  { title: "Alterno", items: [
    { k: "ALT", t: "icao" },
    { k: "ALTNOTAMS", t: "area" },
    { k: "ALTWX", t: "area" }
  ]}
];

/* ====================================================================
   UTILIDADES
   ==================================================================== */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const normHeader = s => String(s == null ? "" : s).replace(/[\s_]/g, "").toUpperCase();
const clean = v => String(v == null ? "" : v).replace(/\r\n/g, "\n").trim();
const isISO = s => /^\d{4}-\d{2}-\d{2}$/.test(s);
const pad2 = n => String(n).padStart(2, "0");
const todayISO = () => { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); };

let toastTimer;
function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove("show"), 2600);
}

const MONTHS = { jan:1, feb:2, mar:3, apr:4, may:5, jun:6, jul:7, aug:8, sep:9, oct:10, nov:11, dec:12,
                 ene:1, abr:4, ago:8, dic:12 };

// Entiende 2026-10-25, 25/10/2026, 8 Oct 2026 y Oct 8, 2026 -> 2026-10-25. Si no la entiende, la deja igual.
function normDate(s) {
  s = clean(s);
  if (!s) return "";
  if (/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0, 10);
  const iso = (y, mo, d) => (mo >= 1 && mo <= 12 && d >= 1 && d <= 31) ? y + "-" + pad2(mo) + "-" + pad2(d) : null;
  let m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})(?:\D.*)?$/);
  if (m) {
    let a = +m[1], b = +m[2], d = a, mo = b;          // por defecto día/mes/año
    if (a <= 12 && b > 12) { mo = a; d = b; }          // 10/25/2026 -> mes/día/año
    return iso(m[3], mo, d) || s;
  }
  m = s.match(/^(\d{1,2})[\s.\-\/]+([A-Za-zÀ-ÿ]{3,9})\.?,?[\s.\-\/]+(\d{4})$/);
  if (m && MONTHS[m[2].slice(0, 3).toLowerCase()]) return iso(m[3], MONTHS[m[2].slice(0, 3).toLowerCase()], +m[1]) || s;
  m = s.match(/^([A-Za-zÀ-ÿ]{3,9})\.?\s+(\d{1,2}),?\s+(\d{4})$/);
  if (m && MONTHS[m[1].slice(0, 3).toLowerCase()]) return iso(m[3], MONTHS[m[1].slice(0, 3).toLowerCase()], +m[2]) || s;
  return s;
}
function fmtDate(v) {
  if (!isISO(v)) return v || "";
  const [y, m, d] = v.split("-");
  return d + "/" + m + "/" + y;
}
// "A" o "cat a" -> "CAT A" (así está escrito en tus hojas)
function normCat(v) {
  v = clean(v);
  const m = v.match(/^(?:CAT\s*)?([ABC])$/i);
  return m ? "CAT " + m[1].toUpperCase() : v;
}
// Las horas que Google Sheets exporta como fecha de 1899 se descartan
function noEpoch(v) {
  v = clean(v);
  return /^\d{1,2}[\/.\-]\d{1,2}[\/.\-](1899|1900)$/.test(v) ? "" : v;
}

/* ====================================================================
   DEFINICIÓN DE LAS DOS COLECCIONES
   ==================================================================== */
function makeNorm(order, headers) {
  const m = {};
  order.forEach(k => { m[normHeader(k)] = k; if (headers && headers[k]) m[normHeader(headers[k])] = k; });
  return m;
}
function loadArr(key) {
  try {
    const raw = localStorage.getItem(key);
    const arr = raw ? JSON.parse(raw) : [];
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}

function renderInfo(side) {
  const ui = infoUI[side];
  if (!ui) return;
  const F = MODES.flights;
  const icao = F.form.elements[side].value;
  ui.ttl.textContent = "Datos del aeropuerto (" + (side === "DEP" ? "salida" : "llegada") + ") · " + (icao || "—");
  ui.body.textContent = "";
  let shown = 0;
  (side === "DEP" ? SNAP_DEP : SNAP_ARR).forEach(([fk, ak]) => {
    const v = snap[fk];
    if (!v) return;
    const row = document.createElement("div"); row.className = "irow";
    const k = document.createElement("span"); k.className = "ik"; k.textContent = LABELS_A[ak] || ak;
    const val = document.createElement("div"); val.className = "iv";
    val.textContent = ak.startsWith("DATE") ? fmtDate(v) : v;
    row.append(k, val); ui.body.appendChild(row); shown++;
  });
  if (!shown) {
    const p = document.createElement("div"); p.className = "none";
    p.textContent = icao
      ? (findAirport(icao) ? "Este aeropuerto no tiene datos guardados." : "Ese ICAO no está en tu lista de Aeropuertos.")
      : "Escribe el ICAO arriba para traer los datos.";

}

function icaoHint(k) {
  const el = hintUI[k];
  if (!el) return;
  const v = MODES.flights.form.elements[k].value;
  el.textContent = (v && !findAirport(v)) ? "No está en tu lista de Aeropuertos" : "";
}

function setSide(side) {
  const form = MODES.flights.form;
  const icao = clean(form.elements[side].value).toUpperCase();
  form.elements[side].value = icao;
  const ap = findAirport(icao);
  (side === "DEP" ? SNAP_DEP : SNAP_ARR).forEach(([fk, ak]) => {
    let v = ap ? clean(ap[ak]) : "";
    if (v && ak.startsWith("DATE")) v = normDate(v);
    if (v && ak === "CAT") v = normCat(v);
    snap[fk] = v;
  });
  snapSrc[side] = icao;
  renderInfo(side);
  icaoHint(side);
  return !!ap;
}

function autosize(el) {
  el.style.height = "auto";
  el.style.height = Math.max(el.scrollHeight + 2, 46) + "px";
}

function makeField(cfg, f) {
  const wrap = document.createElement("label");
  wrap.className = "fld" + (f.t === "area" ? " wide" : "");
  const span = document.createElement("span");
  span.textContent = cfg.labels[f.k] || f.k;
  let el;
  if (f.t === "select") {
    el = document.createElement("select");
    [""].concat(f.opts).forEach(o => {
      const op = document.createElement("option");
      op.value = o; op.textContent = o || "—";
      el.appendChild(op);
    });
  } else if (f.t === "area") {
    el = document.createElement("textarea");
    el.rows = 2;
    el.addEventListener("input", () => autosize(el));
  } else {
    el = document.createElement("input");
    el.type = f.t === "date" ? "date" : "text";
  }
  el.name = f.k;
  if (f.t === "text" || f.t === "icao" || f.t === "reg") {
    el.setAttribute("autocomplete", "off");
    el.setAttribute("autocorrect", "off");
    el.setAttribute("spellcheck", "false");
    const up = f.upper || f.t === "icao" || f.t === "reg";
    el.setAttribute("autocapitalize", up ? "characters" : "none");
    if (up) el.addEventListener("input", () => {
      const p = el.selectionStart;
      el.value = el.value.toUpperCase();
      try { el.setSelectionRange(p, p); } catch (e) {}
    });
  }
  if (f.t === "icao") el.setAttribute("list", "dlAirports");
  if (f.t === "reg") el.setAttribute("list", "dlPlanes");
  el.addEventListener("input", () => { dirty = true; });
  el.addEventListener("change", () => { dirty = true; });
  wrap.append(span, el);
  if (f.t === "icao") {
    const hint = document.createElement("span"); hint.className = "hint";
    wrap.appendChild(hint);
    hintUI[f.k] = hint;
    el.addEventListener("change", () => {
      el.value = clean(el.value).toUpperCase();
      if (f.side) setSide(f.side); else icaoHint(f.k);
    });
  }
  return wrap;
}

function makeInfoBox(side) {
  const box = document.createElement("div"); box.className = "info";
  const head = document.createElement("div"); head.className = "info-head";
  const ttl = document.createElement("b");
  const btn = document.createElement("button"); btn.type = "button"; btn.textContent = "Actualizar";
  btn.addEventListener("click", () => {
    const ok = setSide(side);
    dirty = true;
    toast(ok ? "Datos actualizados desde Aeropuertos" : "Ese ICAO no está en tu lista de Aeropuertos");
  });
  head.append(ttl, btn);
  const body = document.createElement("div");
  box.append(head, body);
  infoUI[side] = { ttl, body };
  return box;
}

function buildForm(cfg) {
  cfg.sections.forEach(sec => {
    const fs = document.createElement("fieldset");
    const lg = document.createElement("legend");
    lg.textContent = sec.title;
    fs.appendChild(lg);
    let grid = null;
    sec.items.forEach(it => {
      if (it.sub) { grid = null; const h = document.createElement("div"); h.className = "sub"; h.textContent = it.sub; fs.appendChild(h); return; }
      if (it.info) { grid = null; fs.appendChild(makeInfoBox(it.info)); return; }
      if (!grid) { grid = document.createElement("div"); grid.className = "grid"; fs.appendChild(grid); }
      grid.appendChild(makeField(cfg, it));
    });
    cfg.form.appendChild(fs);
  });
}

function fillForm(cfg, rec) {
  const form = cfg.form;
  cfg.order.forEach(k => {
    const raw = rec[k] == null ? "" : String(rec[k]);
    if (cfg.id === "flights" && SNAP_KEYS.includes(k)) {
      let v = raw;
      if (k.endsWith("DATE") || k.startsWith("CCI_DATE")) v = normDate(v);
      if (k === "DEP_CAT" || k === "ARR_CAT") v = normCat(v);
      snap[k] = v;
      return;
    }
    const el = form.elements[k];
    if (!el) return;
    let v = raw;
    if (cfg.dateKeys.includes(k)) v = normDate(v);
    if (k === "CAT" && cfg.id === "airports") v = normCat(v);
    if (cfg.id === "flights" && FLIGHT_CLEAN_TIME.includes(k)) v = noEpoch(v);
    if (el.type === "date") {
      el.value = isISO(v) ? v : "";
      el.dataset.raw = isISO(v) ? "" : v;      // si venía en un formato raro, se conserva al guardar
    } else {
      if (el.tagName === "SELECT" && v && !Array.from(el.options).some(o => o.value === v)) {
        const op = document.createElement("option"); op.value = v; op.textContent = v; el.appendChild(op);
      }
      el.value = v;
    }
  });
  if (cfg.id === "flights") {
    snapSrc = { DEP: clean(rec.DEP).toUpperCase(), ARR: clean(rec.ARR).toUpperCase() };
    renderInfo("DEP"); renderInfo("ARR");
    ["DEP", "ARR", "ALT"].forEach(icaoHint);
  }
  form.querySelectorAll("textarea").forEach(autosize);
}

function collectForm(cfg) {
  const form = cfg.form;
  if (cfg.id === "flights") {
    // Si cambió el ICAO y todavía no se refrescó el aeropuerto, se hace ahora
    ["DEP", "ARR"].forEach(side => {
      const v = clean(form.elements[side].value).toUpperCase();
      if (v !== snapSrc[side]) setSide(side);
    });
  }
  const rec = {};
  cfg.order.forEach(k => {
    if (cfg.id === "flights" && SNAP_KEYS.includes(k)) { rec[k] = snap[k] || ""; return; }
    const el = form.elements[k];
    let v = el ? el.value : "";
    if (el && el.type === "date" && v === "" && el.dataset.raw) v = el.dataset.raw;
    rec[k] = clean(v);
  });
  cfg.clean(rec);
  return rec;
}

function showForm(rec, title) {
  const cfg = C();
  // Primero se muestra el formulario y luego se llena, para que los campos de texto midan bien su altura
  $("#main").classList.remove("is-empty");
  $("#app").classList.add("show-form");
  fillForm(cfg, rec);
  $("#formTitle").textContent = title;
  $("#btnDelete").style.display = currentId ? "" : "none";
  dirty = false;
  cfg.form.scrollTop = 0;

function openRecord(id) {

  const rec = cfg.db.find(r => r._id === id);

  currentId = id;
  showForm(rec, cfg.titleOf(rec));

function newRecord() {

  const el = cfg.form.elements[cfg.focusKey];
  if (el) el.focus();

function saveForm() {
  const cfg = C();
  const rec = collectForm(cfg);
  const err = cfg.validate(rec);
  if (err) {
    toast(err);
    const el = cfg.form.elements[cfg.focusKey];
    if (el) el.focus();
    return;
  }
  const k = cfg.key(rec);
  const other = cfg.db.find(r => cfg.key(r) === k && r._id !== currentId);
  if (other) {
    if (!confirm(cfg.dupMsg(rec))) return;
    cfg.db = cfg.db.filter(r => r._id !== other._id);
  }
  const i = currentId ? cfg.db.findIndex(r => r._id === currentId) : -1;
  if (i >= 0) {
    cfg.db[i] = Object.assign({ _id: currentId, _t: cfg.db[i]._t || Date.now() }, rec);
  } else {
    currentId = uid();
    cfg.db.push(Object.assign({ _id: currentId, _t: Date.now() }, rec));
  }
  if (!saveDB(cfg)) return;
  dirty = false;
  $("#formTitle").textContent = cfg.titleOf(rec);
  $("#btnDelete").style.display = "";
  refreshLists();
  renderList();
  toast("Guardado");
}

function deleteRecord() {
  const cfg = C();
  if (!currentId) return;
  const rec = cfg.db.find(r => r._id === currentId);
  if (!confirm("¿Eliminar " + (rec ? cfg.titleOf(rec) : "este registro") + "? No se puede deshacer.")) return;
  cfg.db = cfg.db.filter(r => r._id !== currentId);
  saveDB(cfg);
  currentId = null;
  dirty = false;
  $("#main").classList.add("is-empty");
  $("#app").classList.remove("show-form");

  renderList();
  toast("Eliminado");

/* ====================================================================
   IMPORTAR
   ==================================================================== */
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const first = text.split(/\r?\n/)[0] || "";
  const counts = { ",": 0, ";": 0, "\t": 0 };
  for (const ch of first) if (ch in counts) counts[ch]++;
  const delim = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  const rows = [];
  let row = [], cur = "", inQ = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else if (c === '"' && cur === "") {
      inQ = true;
    } else if (c === delim) {
      row.push(cur); cur = "";
    } else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); cur = "";
      rows.push(row); row = [];
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(v => String(v).trim() !== ""));
}

// Decide si una lista de nombres de columna es de aeropuertos o de vuelos
function detectKind(names) {
  const s = new Set(names.map(normHeader));
  if (s.has("ICAO")) return "airports";
  if (s.has("REG") && s.size <= 2 && !s.has("FLTNUM") && !s.has("DEP")) return "planes";
  if (s.has("FLTNUM") || (s.has("DEP") && s.has("ARR"))) return "flights";
  return null;
}

// Combina registros con los que ya hay: si la clave existe se actualiza, si no se agrega (el último del archivo gana)
function mergeInto(cfg, list) {
  const byKey = new Map();
  let dupes = 0, skipped = 0;
  list.forEach(obj => {
    const r = {};
    Object.keys(obj || {}).forEach(h => { const k = cfg.norm[normHeader(h)]; if (k) r[k] = obj[h]; });
    cfg.clean(r);
    const k = cfg.key(r);
    if (!k) { skipped++; return; }
    if (byKey.has(k)) { dupes++; Object.assign(byKey.get(k), r); } else byKey.set(k, r);
  });
  let added = 0, updated = 0;
  byKey.forEach((r, k) => {
    const ex = cfg.db.find(x => cfg.key(x) === k);
    if (ex) { Object.assign(ex, r); updated++; }
    else { cfg.db.push(Object.assign(cfg.empty(), r, { _id: uid(), _t: Date.now() })); added++; }
  });
  return { added, updated, dupes, skipped };
}

function importText(name, text) {
  const jobs = [];       // {cfg, list}
  const unknown = new Set();
  const isJson = /\.json$/i.test(name) || /^\s*[\[{]/.test(text);
  if (isJson) {
    let data;
    try { data = JSON.parse(text); } catch (e) { alert("El archivo no se pudo leer como JSON."); return; }
    if (Array.isArray(data)) {
      const kind = data.length ? detectKind(Object.keys(data[0] || {})) : null;
      if (kind) jobs.push({ cfg: MODES[kind], list: data });
    } else if (data && typeof data === "object") {
      if (Array.isArray(data.airports)) jobs.push({ cfg: MODES.airports, list: data.airports });
      if (Array.isArray(data.flights)) jobs.push({ cfg: MODES.flights, list: data.flights });
      if (Array.isArray(data.planes)) jobs.push({ cfg: MODES.planes, list: data.planes });
    }
  } else {
    let rows = parseCSV(text);
    // Hoja AVIONES sin encabezado: una sola columna de matrículas
    if (rows.length && rows.every(r => r.length === 1) && /^[A-Z0-9]{1,2}-[A-Z0-9]{2,5}$/i.test(String(rows[0][0]).trim())) rows.unshift(["REG"]);
    if (rows.length < 2) { alert("El archivo no tiene datos."); return; }
    const kind = detectKind(rows[0]);
    if (kind) {
      const cfg = MODES[kind];
      const heads = rows[0];
      heads.forEach(h => { if (String(h).trim() && !cfg.norm[normHeader(h)]) unknown.add(String(h).trim()); });
      const list = rows.slice(1).map(row => { const o = {}; heads.forEach((h, i) => { o[h] = row[i] == null ? "" : row[i]; }); return o; });
      jobs.push({ cfg, list });
    }
  }
  if (!jobs.length) {
    alert("No reconocí el archivo. Debe ser la tabla AD_DB (con la columna ICAO), la tabla FLIGHT_DB (con las columnas DEP y ARR), la hoja AVIONES (matrículas) o un respaldo .json de esta página.");
    return;
  }
  const msgs = [];
  jobs.forEach(j => {
    const res = mergeInto(j.cfg, j.list);
    saveDB(j.cfg);
    let m = ({ flights: "Vuelos", airports: "Aeropuertos", planes: "Aviones" })[j.cfg.id] + ": " + res.added + " nuevos, " + res.updated + " actualizados.";
    if (res.dupes) m += " Repetidos en el archivo: " + res.dupes + " (se usó el de más abajo).";
    if (res.skipped) m += " Filas sin datos clave omitidas: " + res.skipped + ".";
    msgs.push(m);
  });
  if (unknown.size) msgs.push("Columnas ignoradas: " + Array.from(unknown).join(", ") + ".");
  refreshLists();
  if (currentId && !C().db.some(r => r._id === currentId)) currentId = null;
  renderList();
  if (currentId && !dirty) openRecord(currentId);
  alert(msgs.join("\n"));
}

/* ====================================================================
   EXPORTAR
   ==================================================================== */
function toCSV(cfg) {
  const q = v => { v = String(v == null ? "" : v); return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
  const lines = [cfg.order.map(k => q(cfg.headers[k] || k)).join(",")];
  cfg.db.slice().sort((a, b) => cfg.exportSort(a, b)).forEach(r => lines.push(cfg.order.map(k => q(r[k])).join(",")));
  return "﻿" + lines.join("\r\n");
}

async function sendFile(name, mime, text) {
  const file = new File([text], name, { type: mime });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: name }); return true; }
    catch (e) { if (e && e.name === "AbortError") return false; }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement("a");
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  return true;
}
const stamp = () => todayISO();

function cleanCopy(cfg) {
  return cfg.db.map(r => { const o = {}; cfg.order.forEach(k => o[k] = r[k] || ""); return o; });
}
async function exportJSON() {
  const payload = { app: "briefing", version: 2, exported: new Date().toISOString(),
                    airports: cleanCopy(MODES.airports), flights: cleanCopy(MODES.flights), planes: cleanCopy(MODES.planes) };
  const ok = await sendFile("respaldo_" + stamp() + ".json", "application/json", JSON.stringify(payload, null, 2));
  if (ok) {
    try { localStorage.setItem("ad_last_backup", new Date().toISOString()); } catch (e) {}
    renderFoot();
  }
}
async function exportCSV() {
  const cfg = C();
  await sendFile(cfg.csvName + "_" + stamp() + ".csv", "text/csv", toCSV(cfg));
}

  e.target.value = "";
});
